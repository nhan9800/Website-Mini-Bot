---
# cPanel checks out the prebuilt deploy branch into Application Root.
# Keep .env.local and data/ untracked. Build on CI, never on the 2GB host.
# Legacy .next/mimi_feedback_store.json must be backed up/migrated BEFORE
# removing or replacing .next; an untracked legacy file survives a normal pull.
deployment:
  tasks:
    - >-
      test -f "$(pwd)/.next/BUILD_ID" ||
      { echo "HUY DEPLOY: thieu .next/BUILD_ID - phai checkout nhanh deploy"; exit 1; }
    - >-
      APP="$(pwd)"; APPNAME="$(basename "$APP")"; VENV="";
      for CANDIDATE in "$HOME"/nodevenv/"$APPNAME"/*/bin/activate; do
        test -f "$CANDIDATE" || continue;
        if ( . "$CANDIDATE" && node -e "const [major,minor]=process.versions.node.split('.').map(Number); if(major<22||(major===22&&minor<12)) process.exit(1)" ); then
          VENV="$CANDIDATE"; break;
        fi;
      done;
      test -n "$VENV" || { echo "HUY DEPLOY: can nodevenv Node >=22.12.0 cho $APPNAME"; exit 1; };
      . "$VENV" && cd "$APP" &&
      npm ci --omit=dev --no-audit --no-fund &&
      node scripts/migrate-feedback.cjs
    - mkdir -p "$(pwd)/tmp" && touch "$(pwd)/tmp/restart.txt" && echo "DEPLOY XONG"
